[package]
name = "h-embedded"
version = "0.1.0"
edition = "2021"
description = "Embedded-focused H language front-end and board artifact emitter"
license = "MIT"

[[bin]]
name = "h-embedded"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
hl-lexer = { path = ".." }
